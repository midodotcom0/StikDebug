name: Build Exact LocalDevVPN IPA

on:
  pull_request:
    branches: [ "buildbase-localdevvpn-artifact" ]

permissions:
  contents: read

jobs:
  build:
    name: Build LocalDevVPN IPA
    runs-on: macos-latest

    steps:
      - name: Checkout exact LocalDevVPN source
        uses: actions/checkout@v6
        with:
          repository: midodotcom0/LocalDevVPN
          ref: b79d4bf65ed6fd2ac3fe1af26e3f296018e05260
          path: LocalDevVPN-source

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build unsigned archive
        working-directory: LocalDevVPN-source
        run: |
          xcodebuild clean archive \
            -project LocalDevVPN.xcodeproj \
            -scheme LocalDevVPN \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalDevVPN.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package ad-hoc signed IPA with VPN entitlements
        working-directory: LocalDevVPN-source
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/LocalDevVPN.xcarchive/Products/Applications/LocalDevVPN.app Payload/LocalDevVPN.app

          APP="Payload/LocalDevVPN.app"
          EXT="$APP/PlugIns/TunnelProv.appex"

          test -f "$APP/LocalDevVPN"
          test -f "$EXT/TunnelProv"

          rm -rf "$APP/_CodeSignature" "$EXT/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision" "$EXT/embedded.mobileprovision"
          xattr -cr "$APP"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f \( -name '*.dylib' -o -perm +111 \) -print0 | while IFS= read -r -d '' binary; do
              /usr/bin/codesign --force --sign - --timestamp=none "$binary"
            done
          fi

          /usr/bin/codesign --force --sign - --timestamp=none \
            --generate-entitlement-der \
            --entitlements TunnelProv/TunnelProv.entitlements \
            "$EXT"

          /usr/bin/codesign --force --sign - --timestamp=none \
            --generate-entitlement-der \
            --entitlements LocalDevVPN/LocalDevVPN.entitlements \
            "$APP"

          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" > main-entitlements.plist
          /usr/bin/codesign -d --entitlements :- "$EXT" > extension-entitlements.plist
          grep -q 'com.apple.developer.networking.networkextension' main-entitlements.plist
          grep -q 'packet-tunnel-provider' main-entitlements.plist
          grep -q 'com.apple.developer.networking.networkextension' extension-entitlements.plist
          grep -q 'packet-tunnel-provider' extension-entitlements.plist

          ditto -c -k --sequesterRsrc --keepParent Payload LocalDevVPN-working-lan-session-iloader-entitled.ipa

      - name: Store IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalDevVPN-working-lan-session-iloader-entitled
          path: LocalDevVPN-source/LocalDevVPN-working-lan-session-iloader-entitled.ipa
          archive: false
          retention-days: 30
