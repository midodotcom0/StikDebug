name: Build Exact LocalDevVPN IPA

on:
  pull_request:
    branches: [ "buildbase-localdevvpn-artifact" ]

permissions:
  contents: read

jobs:
  build:
    name: Build LocalDevVPN IPA
    runs-on: macos-latest

    steps:
      - name: Checkout exact LocalDevVPN source
        uses: actions/checkout@v6
        with:
          repository: midodotcom0/LocalDevVPN
          ref: b79d4bf65ed6fd2ac3fe1af26e3f296018e05260
          path: LocalDevVPN-source

      - name: Install ldid
        run: brew install ldid

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build archive
        working-directory: LocalDevVPN-source
        run: |
          xcodebuild clean archive \
            -project LocalDevVPN.xcodeproj \
            -scheme LocalDevVPN \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalDevVPN.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package and fake-sign IPA
        working-directory: LocalDevVPN-source
        run: |
          mkdir -p Payload
          cp -R build/LocalDevVPN.xcarchive/Products/Applications/LocalDevVPN.app Payload/LocalDevVPN.app
          APPEX_PATH=$(find Payload/LocalDevVPN.app/PlugIns -name "*.appex" | head -n 1)
          test -n "$APPEX_PATH"
          ldid -S"${GITHUB_WORKSPACE}/LocalDevVPN-source/TunnelProv/TunnelProv.entitlements" "$APPEX_PATH/$(basename "$APPEX_PATH" .appex)"
          ldid -S"${GITHUB_WORKSPACE}/LocalDevVPN-source/LocalDevVPN/LocalDevVPN.entitlements" Payload/LocalDevVPN.app/LocalDevVPN
          zip -r LocalDevVPN-working-lan-session.ipa Payload

      - name: Store IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalDevVPN-working-lan-session
          path: LocalDevVPN-source/LocalDevVPN-working-lan-session.ipa
          archive: false
          retention-days: 30
