name: Build Debug IPA

on:
  pull_request:
    branches: [ "buildbase-stikdebug-30a147" ]

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 1. Fetch Source Code
        uses: actions/checkout@v6

      - name: 2. Configure Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: 3. Compile Project Archive
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: 4. Package .app into .ipa
        run: |
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app .
          mkdir -p Payload
          cp -R StikDebug.app Payload/
          zip -r StikDebug-working-lan-session.ipa Payload
          rm -rf Payload StikDebug.app

      - name: 5. Store IPA as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: StikDebug-working-lan-session
          path: StikDebug-working-lan-session.ipa
          archive: false
          retention-days: 30
