name: Build Exact LocalDevVPN IPA

on:
  pull_request:
    branches: [ "buildbase-localdevvpn-artifact" ]

permissions:
  contents: read

jobs:
  build:
    name: Build LocalDevVPN IPA
    runs-on: macos-latest

    steps:
      - name: Checkout exact LocalDevVPN source
        uses: actions/checkout@v6
        with:
          repository: midodotcom0/LocalDevVPN
          ref: b79d4bf65ed6fd2ac3fe1af26e3f296018e05260
          path: LocalDevVPN-source

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build unsigned archive
        working-directory: LocalDevVPN-source
        run: |
          xcodebuild clean archive \
            -project LocalDevVPN.xcodeproj \
            -scheme LocalDevVPN \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalDevVPN.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA for iLoader signing
        working-directory: LocalDevVPN-source
        run: |
          mkdir -p Payload
          cp -R build/LocalDevVPN.xcarchive/Products/Applications/LocalDevVPN.app Payload/LocalDevVPN.app
          test -f Payload/LocalDevVPN.app/LocalDevVPN
          test -f Payload/LocalDevVPN.app/PlugIns/TunnelProv.appex/TunnelProv
          rm -rf Payload/LocalDevVPN.app/_CodeSignature
          rm -rf Payload/LocalDevVPN.app/PlugIns/TunnelProv.appex/_CodeSignature
          rm -f Payload/LocalDevVPN.app/embedded.mobileprovision
          rm -f Payload/LocalDevVPN.app/PlugIns/TunnelProv.appex/embedded.mobileprovision
          zip -r LocalDevVPN-working-lan-session-unsigned.ipa Payload

      - name: Store IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalDevVPN-working-lan-session-unsigned
          path: LocalDevVPN-source/LocalDevVPN-working-lan-session-unsigned.ipa
          archive: false
          retention-days: 30
