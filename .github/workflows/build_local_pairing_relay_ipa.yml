name: Build Local Pairing Relay IPA

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Relay IPA
    runs-on: macos-latest

    steps:
      - name: Fetch source code
        uses: actions/checkout@v6

      - name: Apply relay integration
        run: |
          python3 scripts/apply_local_pairing_relay.py
          git diff --check
          git diff --exit-code -- StikDebug/Device/LocalPairingRelay.swift || true
          git diff -- StikDebug/Device/JITEnableContext.swift StikDebug/Device/IdeviceFFIBridge.swift

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Compile archive
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/
          file_name="StikDebug-local-pairing-relay-${GITHUB_SHA::7}.ipa"
          zip -r "$file_name" Payload
          rm -rf Payload
          echo "file_name=$file_name" >> "$GITHUB_ENV"

      - name: Store IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: StikDebug-local-pairing-relay
          path: ${{ env.file_name }}
          archive: false
          retention-days: 30
